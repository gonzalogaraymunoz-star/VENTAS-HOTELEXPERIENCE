name: Apply itinerary download integration

on:
  push:
    branches:
      - feat/downloadable-itinerary-pdf

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[itinerary-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/downloadable-itinerary-pdf
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch_itinerary_download.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SalesFlowForm.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: add downloadable itinerary PDF [itinerary-auto]"
            git push origin HEAD:feat/downloadable-itinerary-pdf
          fi
